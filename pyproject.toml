[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audit-harness"
version = "0.1.0"
description = "Docker-isolated audit runner for AI-generated code"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
audit-harness = "app.cli.main:main"
auditcli = "app.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
